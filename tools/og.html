<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>og:image generator — BALLENRAPER</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body{ background:#0d1b2c; color:#cfe9ff; font:13px/1.6 system-ui, sans-serif; margin:0; padding:20px; }
  h1{ font-size:15px; margin:0 0 4px; }
  p{ margin:0 0 16px; color:#8fb6dd; }
  #out{ width:100%; max-width:1200px; border:2px solid #2f7fd4; border-radius:8px; display:block; }
  #stage{ position:absolute; left:-9999px; top:0; width:460px; height:800px; border:0; }
  #log{ margin-top:12px; font-family:ui-monospace, monospace; color:#9bff6e; }
</style>
</head>
<body>

<h1>og:image generator</h1>
<p>
  Zet het echte spel in een verborgen iframe op een mooie stand — een volle buis,
  tafels, een ballenkar — en tekent dat in een kaart van 1200×630 voor Facebook.
  De JPEG gaat via POST naar <code>ogsave.py</code> op poort 8124 en belandt als
  <code>og.jpg</code> in de repo.
</p>

<canvas id="out" width="1200" height="630"></canvas>
<div id="log">bezig…</div>

<iframe id="stage"></iframe>

<script>
const W = 1200, H = 630;
const out = document.getElementById('out');
const c = out.getContext('2d');
const log = m => document.getElementById('log').textContent = m;
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- het echte spel op een stand zetten ----------
   Niet nagetekend maar het spel zelf, zodat de kaart automatisch
   blijft kloppen als de zaal er ooit anders gaat uitzien. */
async function zetStand(){
  const fr = document.getElementById('stage');
  const win = fr.contentWindow, doc = fr.contentDocument;
  const cv = doc.getElementById('game');

  doc.getElementById('mute').click();          // geen geluid tijdens het tekenen
  doc.getElementById('btnStart').click();
  await wait(200);

  const B = win.__BR, G = B.G;

  // een buis die door de zaal kronkelt, met de balletjes erin
  const pad = [];
  let p = { x: 4, y: 3 };
  const route = [[1,0,9],[0,1,4],[-1,0,7],[0,1,3],[1,0,5]];
  pad.push({ x: p.x, y: p.y });
  for (const [dx, dy, n] of route){
    for (let i = 0; i < n; i++){ p = { x: p.x + dx, y: p.y + dy }; pad.push({ x: p.x, y: p.y }); }
  }
  G.snake = pad.reverse();                      // index 0 is de kop
  const kop = G.snake[0], nek = G.snake[1];
  G.dir = { x: Math.sign(kop.x - nek.x), y: Math.sign(kop.y - nek.y) };
  G.grow = 0; G.queue = []; G.invuln = 0;

  G.inBuis = 21;                                // buis bijna vol: amber plastic
  G.balls = 47; G.score = 8460; G.lives = 3; G.level = 5;
  G.tables   = [{ x: 14, y: 2, w: 4, h: 2 }, { x: 15, y: 13, w: 4, h: 2 }, { x: 3, y: 20, w: 4, h: 2 }];
  G.barriers = [{ x: 9, y: 16, w: 1, h: 4 }];
  G.mates    = [{ x: 17, y: 19, dx: 1, t: 0 }];
  G.doors    = [{ x: 0, y: 14, zijde: 'links' }, { x: 13, y: 25, zijde: 'onder' }];
  G.kar      = { x: 16, y: 7 };
  G.food     = { x: 6, y: 12 };
  G.gold     = { x: 19, y: 23, life: 9 };
  G.cell     = { x: 2, y: 8, life: 13 };
  G.parts = []; G.texts = []; G.shake = 0; G.flash = 0;
  G.step = 9e6;                                 // stilzetten zonder tussenscherm
  G.waiting = false; G.screen = 'play';

  doc.getElementById('ballCount').textContent = '047';
  doc.getElementById('scoreDigits').textContent = '008460';
  const vul = doc.getElementById('buisFill');
  vul.style.width = '87.5%'; vul.className = 'bar-fill warn';

  /* Wachten tot er echt iets op het doek staat. Een vaste pauze volstaat
     niet: het iframe staat buiten beeld en tekent soms pas na een tijdje,
     en dan zou de kaart met een lege zaal weggeschreven worden. */
  if (!await wachtOpBeeld(cv)) throw new Error('de zaal bleef leeg');
  await wait(300);
  return cv;
}

async function wachtOpBeeld(cv){
  const g = cv.getContext('2d');
  for (let i = 0; i < 150; i++){
    try {
      const p = g.getImageData((cv.width / 2) | 0, (cv.height / 2) | 0, 1, 1).data;
      if (p[3] > 200) return true;
    } catch (_){ /* doek nog niet klaar */ }
    await wait(100);
  }
  return false;
}

/* ---------- achtergrond in de stijl van het spel ---------- */
function background(){
  const g = c.createRadialGradient(330, 300, 40, 330, 300, 900);
  g.addColorStop(0, '#1f6cc0'); g.addColorStop(.45, '#0f488a'); g.addColorStop(1, '#05203f');
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  c.save(); c.translate(330, 290);
  for (let i = 0; i < 40; i++){
    if (i % 2) continue;
    c.beginPath(); c.moveTo(0, 0);
    const a0 = i * Math.PI / 20, a1 = (i + 1) * Math.PI / 20;
    c.arc(0, 0, 1400, a0, a1); c.closePath();
    c.fillStyle = 'rgba(255,255,255,.035)'; c.fill();
  }
  c.restore();

  const v = c.createRadialGradient(330, 300, 120, 330, 300, 820);
  v.addColorStop(0, 'rgba(3,20,45,0)'); v.addColorStop(1, 'rgba(3,20,45,.75)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
}

function px(size){ c.font = size + 'px "Press Start 2P", monospace'; }

function shadowText(t, x, y, col, sh, dx, dy){
  c.fillStyle = sh; c.fillText(t, x + (dx || 4), y + (dy || 4));
  c.fillStyle = col; c.fillText(t, x, y);
}

async function build(){
  await document.fonts.load('54px "Press Start 2P"');
  await document.fonts.load('18px "Press Start 2P"');
  const cv = await zetStand();

  background();

  // de zaal, groot links
  const bh = 542, bw = bh * 440 / 520;
  c.save();
  c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 40; c.shadowOffsetY = 14;
  c.drawImage(cv, 76, 42, bw, bh);
  c.restore();

  const x0 = 620;
  c.textAlign = 'left';

  // nieuwsflits-label
  c.fillStyle = '#e8634a';
  c.beginPath(); c.roundRect(x0, 104, 306, 34, 5); c.fill();
  px(11); c.fillStyle = '#fff';
  c.fillText('WIELSBEKE NIEUWSFLITS', x0 + 13, 127);

  // logo
  px(54);
  shadowText('BALLEN', x0, 220, '#e0413f', '#4d0b0e', 6, 6);
  shadowText('RAPER',  x0, 288, '#ffd23f', '#6b4c00', 6, 6);

  c.fillStyle = '#e8634a';
  c.fillRect(x0, 318, 210, 8);

  // ondertitel
  c.font = 'bold 27px Georgia, "Times New Roman", serif';
  for (const [t, y] of [['Het tweede videospel van', 376], ['TTC Wielsbeke-Spotit', 412]]){
    c.fillStyle = 'rgba(0,0,0,.6)'; c.fillText(t, x0 + 2, y + 2);
    c.fillStyle = '#ffffff';        c.fillText(t, x0, y);
  }

  // pitch
  px(14); c.fillStyle = '#9dc7f0';
  c.fillText('Raap alles op wat rolt,', x0, 466);
  c.fillText('kieper het in de kar, en', x0, 492);
  c.fillText('struikel niet over je buis.', x0, 518);

  // de zaal van de dag
  px(11); c.fillStyle = '#ffd23f';
  c.fillText('Elke dag dezelfde zaal voor heel de club', x0, 560);

  // url
  px(12); c.fillStyle = '#5f9fd8';
  c.fillText('ttcwielsbeke.github.io/ballenraper', x0, 596);

  // kader
  c.strokeStyle = 'rgba(158,212,255,.55)'; c.lineWidth = 6;
  c.strokeRect(3, 3, W - 6, H - 6);

  log('kaart getekend, versturen…');
  const send = (name, type, q) => new Promise(res => out.toBlob(async b => {
    const r = await fetch('http://127.0.0.1:8124/' + name, { method: 'POST', body: b });
    res(await r.text());
  }, type, q));
  try {
    log('KLAAR — ' + await send('og.jpg', 'image/jpeg', 0.92));
  } catch (e){
    log('POST mislukt (' + e.message + '). Draait ogsave.py op 8124?');
  }
}

const fr = document.getElementById('stage');
fr.addEventListener('load', () => build().catch(e => log('fout: ' + e.message)));
fr.src = '../index.html?debug';
</script>
</body>
</html>
